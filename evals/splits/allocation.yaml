# PRD §43.1 — the exact primary allocation of the 600 evaluation cases, as frozen data.
#
# This file is the machine-readable form of the PRD table and nothing else. It is asserted row for
# row against `pipelines/evaluation/tests/dataset/data/prd-43-1-allocation.json`, which is an
# independent transcription of the same PRD table, so a one-sided edit is a test failure rather
# than a silent redefinition of `EVAL-001`.
#
# `ALLOCATION_EXACT` compares the composed dataset against these counts EXACTLY — not "at least".
# PRD §43.1: "Cases may carry multiple tags, but each has one primary allocation so totals cannot
# drift." Never relax this check to make an incomplete dataset pass; the counts ARE requirement
# `EVAL-001` (PRD §30.2).
#
# `evals/splits/**` deliberately contains NO list of case ids (sub-PRD D4): splits are composed
# from `evals/cases/<slug>/`, so ten authoring tickets never contend on one file.
