[project]
name = "taxrag"
version = "0.0.0"
description = "taxrag monorepo root (uv workspace)."
# Breakdown plan section 8 Q12 (CONFIRMED) / sub-PRD D17: exact pin, never a `>=` range.
requires-python = "==3.14.6"
dependencies = []

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["pipelines/*", "sdk/python"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["pipelines", "sdk"]
pythonpath = ["."]
addopts = "-p tools.pytest_exit_zero_when_empty -ra"
