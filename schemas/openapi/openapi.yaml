# AustraliaEmploymentRAG — the /v1 API contract.
#
# PRD §34 preamble: "The OpenAPI file at schemas/openapi/openapi.yaml will be the generated-code
# source of truth. The examples below are normative payload shapes; property names and enum meanings
# cannot drift from them without PRD/API change control."
#
# Owned by 00-foundation/FND-04 (PRD §44.3 names the OpenAPI root a serial-owned artifact). No other
# module may write this file; a module needing a new operation asks for a new 00-foundation ticket
# (FND-04 Feedback obligation 3).
#
# READ THIS BEFORE EDITING
#
#  * PATH KEYS ARE RELATIVE TO servers[0] (`/v1`). PRD §16.2 writes absolute paths such as
#    `/v1/search`; the endpoint replay test composes `servers[0].url + <path key>` and compares it to
#    the verbatim PRD string in packages/contracts/test/openapi/prd-16-2-endpoints.json
#    (sub-PRD D26a). servers[1] is `/internal/v1`, declared so the base path exists in the contract
#    (PRD §16.1); its operations belong to 22-internal-admin (FND-04 Non-goal 6).
#
#  * ENUMS ARE NEVER INLINED. The `enum` keyword may appear ONLY directly inside a
#    `components.schemas.<Name>` whose <Name> is a key of FND-03's ENUM_REGISTRY, and the member list
#    must equal that entry in registry order (sub-PRD D6; FND-04 acceptance item 5). Fixed single
#    values use `const`. §34 fields whose family FND-03 did not register are plain strings — see
#    sub-PRD Q-F10, and never widen the registry from here.
#
#  * THE `x-` MARKERS ARE MANDATORY, NOT DECORATIVE (sub-PRD D26b). A missing marker is a test
#    failure, so a new operation cannot slip past a convention scan by omitting the annotation:
#      x-prd-basis          every operation — the PRD section it is transcribed from
#      x-mutable-resource   every PATCH/PUT/DELETE — true ⇒ If-Match + 409 CONCURRENT_MODIFICATION,
#                           and the resource's GET must declare the ETag response header
#      x-retryable-write    every POST/PUT/PATCH/DELETE — true ⇒ Idempotency-Key + 409
#                           IDEMPOTENCY_CONFLICT. True exactly when a duplicate would be observable
#                           (it creates a resource or a delivery), false for state-idempotent actions
#      x-read-only /        POST /search only — PRD §16.2 "Search is read-only despite POST and MUST
#      x-charges-credits    not consume generation credits"
#      x-envelope-exempt    a 2xx schema that does not allOf ResponseEnvelope, with a reason citing
#                           the PRD block that overrides it (sub-PRD D27)
#      x-prd-payload-gap    an operation PRD §16.2/§16.3 names but §34 gives no payload for, marked
#                           with the product module that owns extending it (sub-PRD Q-F9)
#      x-enum-usage /       on enum schemas — makes D25's breaking-change rule decidable
#      x-closed-enum
#
#  * TENANT IS NEVER A REQUEST FIELD. PRD §34.1: "Tenant | Never accepted in a request body; derived
#    from authenticated session/key/widget token"; PRD §16.5 makes other-tenant and absent IDs share
#    one not-found response, so no operation declares a distinct 403 for a cross-tenant read.
#    test/openapi/tenant-leak.test.ts scans every parameter and every nested request-body property.
openapi: '3.1.0'

info:
  title: AustraliaEmploymentRAG API
  version: '1.0'
  summary: Evidence-first Australian employment-law research over official sources.
  description: |
    PRD §16.1 platform rules, in force for every operation below:

    * Base path `/v1`; internal administration `/internal/v1`.
    * JSON/HTTPS, stable opaque IDs, ISO 8601 UTC timestamps and cursor pagination.
    * Legal dates use explicit Australian calendar dates.
    * Organisation is derived from authenticated context, not trusted request fields.
    * Every response includes `request_id`.
    * Retryable writes support `Idempotency-Key`.
    * HTTP status and domain answer status remain separate — PRD §34.9: "Domain answer statuses such
      as `INSUFFICIENT_EVIDENCE` are valid completed research results and do not become HTTP errors."
    * Optional fields may be added within v1; breaking changes require v2.
    * Webhooks carry their own schema version (their schemas are `FND-05`, not this document).
  license:
    name: UNLICENSED
    identifier: LicenseRef-proprietary

servers:
  - url: /v1
    description: |
      The public API base path (PRD §16.1). Every key under `paths` is relative to this server.
  - url: /internal/v1
    description: |
      The internal administration base path (PRD §16.1). Declared so the base path exists in the
      contract; its operations are owned by `22-internal-admin` and are deliberately absent here
      (FND-04 Non-goal 6).

security:
  - sessionCookie: []
  - apiCredential: []
  - widgetSessionToken: []

tags:
  - name: Search and authorities
    description: PRD §16.2 "Search and authorities".
  - name: Answers
    description: PRD §16.2 "Answers".
  - name: Compare and coverage
    description: PRD §16.2 "Compare and coverage".
  - name: Research and collaboration
    description: PRD §16.2 "Research and collaboration".
  - name: Monitor and delivery
    description: PRD §16.2 "Monitor and delivery".
  - name: Export, usage, audit and issues
    description: PRD §16.2 "Export, usage, audit and issues".
  - name: Authentication and machine access
    description: PRD §16.3 "Authentication and machine access".

components:

  # ---------------------------------------------------------------------------------------------
  # Security schemes (FND-04 deliverable 1)
  #
  # PRD §34.1 Tenant row: the organisation is derived from the authenticated session, key or widget
  # token. NO SCHEME ACCEPTS AN ORGANISATION IDENTIFIER, and test/openapi/tenant-leak.test.ts asserts
  # it — an apiKey scheme whose `name` were an organisation header would be exactly the leak §16.5
  # forbids.
  # ---------------------------------------------------------------------------------------------
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: aer_session
      description: |
        The Web session cookie (PRD §16.3, §38.4). Opaque; the organisation and the membership are
        resolved from it server-side, never from a request field.
    apiCredential:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        A service-account bearer credential (PRD §16.3). Its scopes are `ApiScope` members. Displayed
        only on creation and on rotation; PRD §16.4 keeps credential material out of logs, exports
        and support surfaces, so no response schema in this document returns one.
    widgetSessionToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        A short-lived widget session token (PRD §38.4). Carries its own tenant binding; the widget
        never names an organisation in a request.

  # ---------------------------------------------------------------------------------------------
  # Reusable parameters — DECLARED ONCE, $ref'd EVERYWHERE (FND-04 acceptance item 12).
  # PRD §34.1: pagination `page_size` 1-100 default 25 with an opaque `next_cursor`; idempotency key
  # 16-128 characters; `ETag` + `If-Match` on mutable resources.
  # ---------------------------------------------------------------------------------------------
  parameters:
    PageSize:
      name: page_size
      in: query
      required: false
      description: 'PRD §34.1: page size, 1-100, default 25.'
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      required: false
      description: 'PRD §34.1: the opaque `next_cursor` returned by the previous page. Never parsed by clients.'
      schema:
        type: string
        minLength: 1
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        PRD §34.1: 16-128 characters. The same actor, route, key and body returns the original
        result; a changed body returns `409 IDEMPOTENCY_CONFLICT`.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        PRD §16.2/§34.1: the `ETag` last read for this resource. A stale value returns
        `409 CONCURRENT_MODIFICATION`.
      schema:
        type: string
        minLength: 1

  # ---------------------------------------------------------------------------------------------
  # Response headers
  # ---------------------------------------------------------------------------------------------
  headers:
    ETag:
      description: 'PRD §34.1: the current version of a mutable resource. Echo it in `If-Match` on the next write.'
      required: true
      schema:
        type: string
        minLength: 1
    RetryAfter:
      description: 'PRD §34.9 `RATE_LIMITED` user action: "Honour `Retry-After`".'
      required: false
      schema:
        type: integer
        minimum: 0

  # ---------------------------------------------------------------------------------------------
  # THE ERROR CATALOGUE (FND-04 deliverable 2) — all 17 PRD §34.9 codes, exactly, no more and no
  # fewer, all sharing the single PRD §16.1 error schema.
  #
  # `x-retryable` is derived from the PRD Retry column by one rule, applied to all 17 rows:
  # FALSE for "No" and "No automatic retry", TRUE for every column value naming a condition after
  # which a retry succeeds ("Yes", "After login", "After MFA", "After reauth", "After refetch",
  # "After edit", "After reset/funding", "After recovery", "One safe retry"). The rule, the Retry
  # column text and the HTTP status are transcribed into
  # packages/contracts/test/openapi/prd-34-9-errors.json and re-extracted from docs/PRD.md §34.9 by
  # test/openapi/error-catalogue.test.ts, so neither this block nor the fixture can drift from the
  # PRD (sub-PRD D7 assigns the status, the flag and the schema to this ticket).
  #
  # PRD §34.3 also names `409 CLARIFICATION_ROUND_CLOSED`, which §34.9 does not list and FND-03's
  # ERROR_CODE_VALUES therefore does not contain. It is NOT invented here — see sub-PRD Q-F8.
  # ---------------------------------------------------------------------------------------------
  responses:
    InvalidRequest:
      description: '400 `INVALID_REQUEST` — correct named fields.'
      x-error-code: INVALID_REQUEST
      x-http-status: 400
      x-retryable: false
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidLegalDate:
      description: '400 `INVALID_LEGAL_DATE` — supply valid date/confirm future research.'
      x-error-code: INVALID_LEGAL_DATE
      x-http-status: 400
      x-retryable: false
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidAbn:
      description: '400 `INVALID_ABN` — correct ABN checksum.'
      x-error-code: INVALID_ABN
      x-http-status: 400
      x-retryable: false
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AuthenticationRequired:
      description: '401 `AUTHENTICATION_REQUIRED` — authenticate.'
      x-error-code: AUTHENTICATION_REQUIRED
      x-http-status: 401
      x-retryable: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    MfaRequired:
      description: '403 `MFA_REQUIRED` — complete MFA.'
      x-error-code: MFA_REQUIRED
      x-http-status: 403
      x-retryable: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RecentAuthRequired:
      description: '403 `RECENT_AUTH_REQUIRED` — reauthenticate.'
      x-error-code: RECENT_AUTH_REQUIRED
      x-http-status: 403
      x-retryable: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ResourceNotFound:
      description: |
        404 `RESOURCE_NOT_FOUND` — check ID; same response for forbidden/other tenant.

        PRD §16.5: "Other-tenant and absent opaque IDs return the same not-found response." No
        operation in this document declares a distinct `403` for a cross-tenant read; a distinct
        status would leak the existence of another tenant's resource.
      x-error-code: RESOURCE_NOT_FOUND
      x-http-status: 404
      x-retryable: false
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    IdempotencyConflict:
      description: '409 `IDEMPOTENCY_CONFLICT` — reuse original body or new key. PRD §34.1: a changed body under the same key.'
      x-error-code: IDEMPOTENCY_CONFLICT
      x-http-status: 409
      x-retryable: false
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ConcurrentModification:
      description: '409 `CONCURRENT_MODIFICATION` — reload latest ETag. PRD §16.2: a stale `If-Match`. Distinct from `IDEMPOTENCY_CONFLICT`, which shares the status but not the cause.'
      x-error-code: CONCURRENT_MODIFICATION
      x-http-status: 409
      x-retryable: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    EphemeralContentExpired:
      description: '410 `EPHEMERAL_CONTENT_EXPIRED` — run new research if required (PRD §10.4).'
      x-error-code: EPHEMERAL_CONTENT_EXPIRED
      x-http-status: 410
      x-retryable: false
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    EmployeePiiDetected:
      description: '422 `EMPLOYEE_PII_DETECTED` — replace indicated spans with anonymous placeholders.'
      x-error-code: EMPLOYEE_PII_DETECTED
      x-http-status: 422
      x-retryable: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: '429 `RATE_LIMITED` — honour `Retry-After`.'
      x-error-code: RATE_LIMITED
      x-http-status: 429
      x-retryable: true
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    CreditLimitReached:
      description: '429 `CREDIT_LIMIT_REACHED` — wait, prepay or configure approved BYOK. Never declared on a read-only operation.'
      x-error-code: CREDIT_LIMIT_REACHED
      x-http-status: 429
      x-retryable: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GenerationUnavailable:
      description: '503 `GENERATION_UNAVAILABLE` — search remains available; retry when status recovers.'
      x-error-code: GENERATION_UNAVAILABLE
      x-http-status: 503
      x-retryable: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    SourceNotCurrent:
      description: '503 `SOURCE_NOT_CURRENT` — review freshness/official link or wait for recovery. No automatic retry.'
      x-error-code: SOURCE_NOT_CURRENT
      x-http-status: 503
      x-retryable: false
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    CorpusIncompatible:
      description: '503 `CORPUS_INCOMPATIBLE` — maintenance; operator action required.'
      x-error-code: CORPUS_INCOMPATIBLE
      x-http-status: 503
      x-retryable: false
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: '500 `INTERNAL_ERROR` — quote request ID to support. One safe retry.'
      x-error-code: INTERNAL_ERROR
      x-http-status: 500
      x-retryable: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

    # -------------------------------------------------------------------------------------------
    # COMPOSITE responses. An HTTP status is NOT one-to-one with a §34.9 code — three codes are 400,
    # two are 403, two are 409, two are 429 and three are 503 — and an OpenAPI `responses` map has
    # one entry per status. Where several codes of one status apply to the same operation, the
    # operation references a composite carrying `x-error-codes` instead of a single `x-error-code`.
    #
    # The 17 single-code entries above remain THE catalogue (FND-04 deliverable 2, acceptance item
    # 4): test/openapi/error-catalogue.test.ts checks status + `retryable` on exactly those, and
    # additionally asserts that every composite's status equals each of its members' status and that
    # every member is one of the 17 — so a composite can never smuggle in an eighteenth code.
    #
    # The two 409s are never both applicable: PRD §34.1 lists `If-Match` and `Idempotency-Key` as
    # separate rows and this document uses them as alternatives — a create is a retryable write
    # (`IDEMPOTENCY_CONFLICT`), a `PATCH`/`DELETE` of a mutable resource is conditional on `If-Match`
    # (`CONCURRENT_MODIFICATION`). Conflating the two is the easy silent error, so they are kept
    # apart by construction and asserted by test/openapi/conventions.test.ts.
    # -------------------------------------------------------------------------------------------
    InvalidRequestOrLegalDate:
      description: '400 — `INVALID_REQUEST` or `INVALID_LEGAL_DATE`.'
      x-error-codes: [INVALID_REQUEST, INVALID_LEGAL_DATE]
      x-http-status: 400
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidRequestOrLegalDateOrAbn:
      description: '400 — `INVALID_REQUEST`, `INVALID_LEGAL_DATE` or `INVALID_ABN`.'
      x-error-codes: [INVALID_REQUEST, INVALID_LEGAL_DATE, INVALID_ABN]
      x-http-status: 400
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    MfaOrRecentAuthRequired:
      description: '403 — `MFA_REQUIRED` or `RECENT_AUTH_REQUIRED`. Declared on security-sensitive PRD §16.3 operations. NEVER used for a cross-tenant read, which is `404` (PRD §16.5).'
      x-error-codes: [MFA_REQUIRED, RECENT_AUTH_REQUIRED]
      x-http-status: 403
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimitedOrCreditLimitReached:
      description: '429 — `RATE_LIMITED` or `CREDIT_LIMIT_REACHED`. Declared only on credit-consuming operations; PRD §16.2 forbids it on search.'
      x-error-codes: [RATE_LIMITED, CREDIT_LIMIT_REACHED]
      x-http-status: 429
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GenerationServiceUnavailable:
      description: '503 — `GENERATION_UNAVAILABLE`, `SOURCE_NOT_CURRENT` or `CORPUS_INCOMPATIBLE`.'
      x-error-codes: [GENERATION_UNAVAILABLE, SOURCE_NOT_CURRENT, CORPUS_INCOMPATIBLE]
      x-http-status: 503
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    SearchServiceUnavailable:
      description: '503 — `SOURCE_NOT_CURRENT` or `CORPUS_INCOMPATIBLE`. `GENERATION_UNAVAILABLE` is deliberately absent: PRD §34.9 says "Search remains available".'
      x-error-codes: [SOURCE_NOT_CURRENT, CORPUS_INCOMPATIBLE]
      x-http-status: 503
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:

    # -------------------------------------------------------------------------------------------
    # ENUM SCHEMAS — generated from FND-03's ENUM_REGISTRY, member lists in registry order.
    # These are the ONLY places in this document where the `enum` keyword may appear (sub-PRD D6,
    # FND-04 acceptance item 5); test/openapi/enum-drift.test.ts asserts both halves of that rule.
    # A member is added by adding it to packages/contracts/src/enums/**, never here.
    # `x-enum-usage` / `x-closed-enum` make sub-PRD D25's breaking-change rule decidable.
    # -------------------------------------------------------------------------------------------
    AnswerStatus:
      description: 'PRD §8.4 — a domain answer status. PRD §34.9: these are completed research results and never HTTP errors.'
      type: string
      x-enum-usage: response
      x-closed-enum: true
      enum: [SUPPORTED, CONDITIONAL, INSUFFICIENT_EVIDENCE, CONFLICTING_SOURCES, OUT_OF_SCOPE, SOURCE_NOT_CURRENT]
    ApiScope:
      description: 'PRD §16.3 service scopes.'
      type: string
      x-enum-usage: both
      x-closed-enum: true
      enum: ['search:read', 'answers:create', 'records:read', 'records:write', 'coverage:create', 'monitor:read', 'monitor:write', 'exports:create', 'usage:read']
    AsyncState:
      description: 'PRD §31.3 — the job lifecycle state. Separate from the HTTP status (PRD §16.1).'
      type: string
      x-enum-usage: response
      x-closed-enum: true
      enum: [IDLE, VALIDATING, QUEUED, RUNNING, WAITING_FOR_CLARIFICATION, CANCELLING, COMPLETED, FAILED, CANCELLED, EXPIRED]
    ChangeType:
      description: 'PRD §8.8 — the kind of official change an alert reports.'
      type: string
      x-enum-usage: response
      x-closed-enum: true
      enum: [AMENDMENT, COMMENCEMENT, RATE, REPLACEMENT, APPEAL, GUIDANCE, SOURCE_REMOVAL, FRESHNESS]
    CitationRole:
      description: 'PRD §15.5 — how a citation relates to the claim it is attached to.'
      type: string
      x-enum-usage: response
      x-closed-enum: true
      enum: [SUPPORTS, QUALIFIES, CONTRADICTS, DEFINES, BACKGROUND_ONLY]
    ClaimSupport:
      description: 'PRD §15.5 — the evidential support status of a single claim.'
      type: string
      x-enum-usage: response
      x-closed-enum: true
      enum: [DIRECTLY_SUPPORTED, SUPPORTED_BY_INFERENCE, CONDITIONAL, CONTRADICTED, NOT_SUPPORTED]
    CoverageCandidateStatus:
      description: 'PRD §8.5 — the confidence status of a coverage candidate.'
      type: string
      x-enum-usage: response
      x-closed-enum: true
      enum: [CONFIRMED_FROM_STATED_FACTS, LIKELY, POSSIBLE, UNLIKELY, EXCLUDED, INSUFFICIENT_EVIDENCE]
    ErrorCode:
      description: 'PRD §34.9 — the complete error catalogue, in table order.'
      type: string
      x-enum-usage: response
      x-closed-enum: true
      enum: [INVALID_REQUEST, INVALID_LEGAL_DATE, INVALID_ABN, AUTHENTICATION_REQUIRED, MFA_REQUIRED, RECENT_AUTH_REQUIRED, RESOURCE_NOT_FOUND, IDEMPOTENCY_CONFLICT, CONCURRENT_MODIFICATION, EPHEMERAL_CONTENT_EXPIRED, EMPLOYEE_PII_DETECTED, RATE_LIMITED, CREDIT_LIMIT_REACHED, GENERATION_UNAVAILABLE, SOURCE_NOT_CURRENT, CORPUS_INCOMPATIBLE, INTERNAL_ERROR]
    LegalStatus:
      description: 'PRD §6.7 — the legal status of a source at the requested legal date.'
      type: string
      x-enum-usage: both
      x-closed-enum: true
      enum: [IN_FORCE, ENACTED_NOT_IN_FORCE, BILL_NOT_ENACTED, DRAFT_OR_CONSULTATION, REPEALED, SUPERSEDED, STATUS_UNCONFIRMED]
    RecordWorkflowState:
      description: 'PRD §8.7 — the review workflow state of a Research Record.'
      type: string
      x-enum-usage: both
      x-closed-enum: true
      enum: [DRAFT, IN_REVIEW, CUSTOMER_REVIEWED, REVIEW_REQUIRED, ARCHIVED]
    Role:
      description: 'PRD §8.1 — an organisation membership role.'
      type: string
      x-enum-usage: both
      x-closed-enum: true
      enum: [OWNER, ADMIN, RESEARCHER, VIEWER, DEVELOPER]
    SsoConnectionState:
      description: 'PRD §16.3 — SSO connection states. PRD §16.3: "SSO cannot be enforced before a successful test."'
      type: string
      x-enum-usage: response
      x-closed-enum: true
      enum: [DRAFT, TESTING, ACTIVE, ERROR, DISABLED]

    # -------------------------------------------------------------------------------------------
    # Shared primitives
    # -------------------------------------------------------------------------------------------
    OpaqueId:
      description: 'PRD §34.1: an opaque resource-prefixed UUIDv7 string, for example `ans_...`. Clients never parse them.'
      type: string
      minLength: 3
      maxLength: 128
      pattern: '^[a-z][a-z0-9]*_[A-Za-z0-9._-]+$'
    LegalDate:
      description: 'PRD §34.1: an Australian legal date, `YYYY-MM-DD`.'
      type: string
      format: date
    Timestamp:
      description: 'PRD §34.1: an ISO 8601 UTC timestamp.'
      type: string
      format: date-time
    Cursor:
      description: 'PRD §34.1: the opaque `next_cursor`; `null` on the last page.'
      type: [string, 'null']
    JurisdictionCode:
      description: 'An Australian jurisdiction code, for example `CTH` or `VIC`. Not an `ENUM_REGISTRY` family — see sub-PRD Q-F10.'
      type: string
      minLength: 2
      maxLength: 8
    Warning:
      description: 'A non-fatal advisory attached to a response. PRD §34.2 shows the array; it specifies no member shape (sub-PRD Q-F9).'
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    # -------------------------------------------------------------------------------------------
    # The common response envelope (FND-04 deliverable 1; PRD §16.1, §34.2, §34.5).
    # Every 2xx JSON response either allOf's this or declares `x-envelope-exempt` with a reason
    # citing the PRD block that overrides it (sub-PRD D27). The two exemptions are AnswerSnapshot
    # (§34.5 has `schema_version` but no `request_id`) and AnswerJobClarificationRequired (§34.3 has
    # neither) — PRD §34 is normative and acceptance item 3 fails any example with an ADDED property.
    # -------------------------------------------------------------------------------------------
    ResponseEnvelope:
      description: 'PRD §16.1: every response carries `request_id`; PRD §34.1: `/v1` plus a response `schema_version`.'
      type: object
      required: [schema_version, request_id]
      properties:
        schema_version:
          type: string
          const: '1.0'
        request_id:
          $ref: '#/components/schemas/OpaqueId'

    Error:
      description: 'PRD §16.1 uniform error shape.'
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
        request_id: { $ref: '#/components/schemas/OpaqueId' }
        details:
          description: 'Machine-readable context, for example the named fields `INVALID_REQUEST` refers to.'
          type: object
          additionalProperties: true
        retryable:
          description: 'The PRD §34.9 Retry column, reduced to a boolean by the rule stated above `components.responses`.'
          type: boolean
    ErrorResponse:
      description: 'PRD §16.1: the single error envelope every error response in this document shares.'
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/Error' }

    # -------------------------------------------------------------------------------------------
    # PRD §34.2 — Search (normative; schemas/openapi/examples/prd-34-2-*.json)
    # -------------------------------------------------------------------------------------------
    SearchRequest:
      description: 'PRD §34.2 request. Carries NO organisation field (PRD §34.1 Tenant row).'
      type: object
      additionalProperties: false
      required: [query]
      properties:
        mode:
          description: 'The search mode, for example `ADVANCED`. Not an `ENUM_REGISTRY` family — sub-PRD Q-F10.'
          type: string
        query: { type: string, minLength: 1 }
        legal_as_at: { $ref: '#/components/schemas/LegalDate' }
        jurisdictions:
          type: array
          items: { $ref: '#/components/schemas/JurisdictionCode' }
        document_types:
          description: 'Source document types, for example `ACT`. Not an `ENUM_REGISTRY` family — sub-PRD Q-F10.'
          type: array
          items: { type: string }
        legal_statuses:
          type: array
          items: { $ref: '#/components/schemas/LegalStatus' }
        authority_ids:
          type: array
          items: { $ref: '#/components/schemas/OpaqueId' }
        exact_identifiers:
          type: array
          items: { type: string }
        employer:
          description: 'An optional employer context. `null` when not applicable (PRD §34.1 Nulls row).'
          type: [object, 'null']
          additionalProperties: false
          properties:
            name: { type: string }
            abn: { type: string, pattern: '^\d{11}$' }
        sort:
          description: 'Result ordering, for example `RELEVANCE`. Not an `ENUM_REGISTRY` family — sub-PRD Q-F10.'
          type: string
        page_size: { type: integer, minimum: 1, maximum: 100, default: 25 }
        cursor: { $ref: '#/components/schemas/Cursor' }
    SearchResultSnippet:
      description: 'PRD §34.2: "`snippet.text` MUST equal the referenced NodeVersion substring at the returned offsets after the documented canonical newline normalisation."'
      type: object
      additionalProperties: false
      required: [text, start_offset, end_offset]
      properties:
        text: { type: string }
        start_offset: { type: integer, minimum: 0 }
        end_offset: { type: integer, minimum: 0 }
    AuthorityRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        name: { type: string }
    SearchResult:
      description: 'PRD §34.2 result. Search returns official source excerpts only — never a generated summary.'
      type: object
      additionalProperties: false
      required: [document_id, document_version_id, node_id, node_version_id, title, document_type, authority, jurisdictions, legal_status, effective_from, effective_to, pinpoint, snippet, match_reasons, freshness, official_url]
      properties:
        document_id: { $ref: '#/components/schemas/OpaqueId' }
        document_version_id: { $ref: '#/components/schemas/OpaqueId' }
        node_id: { $ref: '#/components/schemas/OpaqueId' }
        node_version_id: { $ref: '#/components/schemas/OpaqueId' }
        title: { type: string }
        document_type: { type: string }
        authority: { $ref: '#/components/schemas/AuthorityRef' }
        jurisdictions:
          type: array
          items: { $ref: '#/components/schemas/JurisdictionCode' }
        legal_status: { $ref: '#/components/schemas/LegalStatus' }
        effective_from: { $ref: '#/components/schemas/LegalDate' }
        effective_to: { type: [string, 'null'], format: date }
        pinpoint: { type: string }
        snippet: { $ref: '#/components/schemas/SearchResultSnippet' }
        match_reasons:
          description: 'Why the result matched, for example `EXACT_PROVISION`. Not an `ENUM_REGISTRY` family — sub-PRD Q-F10.'
          type: array
          items: { type: string }
        freshness:
          description: 'Source freshness, for example `CURRENT`. Not an `ENUM_REGISTRY` family — sub-PRD Q-F10.'
          type: string
        official_url: { type: string, format: uri }
    SearchResponse:
      description: 'PRD §34.2 response.'
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          required: [search_execution_id, corpus_release_id, legal_as_at, applied_filters, results, next_cursor, warnings]
          properties:
            search_execution_id: { $ref: '#/components/schemas/OpaqueId' }
            corpus_release_id: { $ref: '#/components/schemas/OpaqueId' }
            legal_as_at: { $ref: '#/components/schemas/LegalDate' }
            applied_filters:
              type: object
              additionalProperties: false
              properties:
                jurisdictions:
                  type: array
                  items: { $ref: '#/components/schemas/JurisdictionCode' }
                legal_statuses:
                  type: array
                  items: { $ref: '#/components/schemas/LegalStatus' }
            results:
              type: array
              items: { $ref: '#/components/schemas/SearchResult' }
            next_cursor: { $ref: '#/components/schemas/Cursor' }
            warnings:
              type: array
              items: { $ref: '#/components/schemas/Warning' }
      unevaluatedProperties: false

    # -------------------------------------------------------------------------------------------
    # PRD §34.3 — Create an Answer job (normative)
    # -------------------------------------------------------------------------------------------
    AnswerFacts:
      description: 'PRD §34.3 fact object. Anonymous by contract — PRD §34.9 `EMPLOYEE_PII_DETECTED` rejects identified employee data.'
      type: object
      additionalProperties: false
      properties:
        free_text: { type: string }
        employer_name: { type: string }
        employer_abn: { type: string, pattern: '^\d{11}$' }
        work_jurisdictions:
          type: array
          items: { $ref: '#/components/schemas/JurisdictionCode' }
        engagement_type:
          description: 'For example `EMPLOYEE`. Not an `ENUM_REGISTRY` family — sub-PRD Q-F10.'
          type: string
        employment_type:
          description: 'For example `FULL_TIME`. Not an `ENUM_REGISTRY` family — sub-PRD Q-F10.'
          type: string
        industry: { type: string }
        principal_duties:
          type: array
          items: { type: string }
    CreateAnswerJobRequest:
      description: |
        PRD §34.3 request. "For `SAVE`, exactly one of `research_record_id` or
        `new_record: {"title":"…","tags":[]}` is required. Creating a record and admitting the job
        occur in the same transaction. For `EPHEMERAL`, both fields must be absent."
      type: object
      additionalProperties: false
      required: [mode, question]
      properties:
        mode:
          description: 'For example `QUICK`. Not an `ENUM_REGISTRY` family — sub-PRD Q-F10.'
          type: string
        question: { type: string, minLength: 1 }
        facts: { $ref: '#/components/schemas/AnswerFacts' }
        legal_as_at: { $ref: '#/components/schemas/LegalDate' }
        jurisdictions:
          type: array
          items: { $ref: '#/components/schemas/JurisdictionCode' }
        retention_mode:
          description: '`SAVE` or `EPHEMERAL` (PRD §34.3, §10.4). Not an `ENUM_REGISTRY` family — sub-PRD Q-F10.'
          type: string
        research_record_id: { type: [string, 'null'], pattern: '^[a-z][a-z0-9]*_[A-Za-z0-9._-]+$' }
        new_record:
          type: [object, 'null']
          additionalProperties: false
          required: [title]
          properties:
            title: { type: string }
            tags:
              type: array
              items: { type: string }
    JobDescriptor:
      description: 'PRD §34.3 accepted-response job object.'
      type: object
      additionalProperties: false
      required: [id, type, status, retention_mode, corpus_release_id, reserved_credits, created_at, status_url, events_url]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        type:
          description: 'For example `QUICK_ANSWER`. Not an `ENUM_REGISTRY` family — sub-PRD Q-F10.'
          type: string
        status: { $ref: '#/components/schemas/AsyncState' }
        retention_mode: { type: string }
        corpus_release_id: { $ref: '#/components/schemas/OpaqueId' }
        reserved_credits: { type: integer, minimum: 0 }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        status_url:
          description: 'A path relative to the API root, not an absolute URL — PRD §34.3 shows `/v1/answer-jobs/job_...`.'
          type: string
        events_url: { type: string }
    AnswerJobAccepted:
      description: 'PRD §34.3 accepted response (`202`).'
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          required: [job]
          properties:
            job: { $ref: '#/components/schemas/JobDescriptor' }
      unevaluatedProperties: false
    Clarification:
      description: 'PRD §34.3 clarification question.'
      type: object
      additionalProperties: false
      required: [id, question, affects, answer_type]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        question: { type: string }
        affects:
          description: 'What the answer changes, for example `WORKPLACE_RELATIONS_SYSTEM`. Not an `ENUM_REGISTRY` family — sub-PRD Q-F10.'
          type: array
          items: { type: string }
        answer_type:
          description: 'For example `YES_NO_UNKNOWN`. Not an `ENUM_REGISTRY` family — sub-PRD Q-F10.'
          type: string
    AnswerJobClarificationRequired:
      description: |
        PRD §34.3: "Clarification response still uses `202`; the job status becomes
        `WAITING_FOR_CLARIFICATION` and supplies questions."
      type: object
      additionalProperties: false
      required: [status, clarifications]
      x-envelope-exempt: true
      x-envelope-exempt-reason: |
        PRD §34.3's clarification block declares neither `schema_version` nor `request_id`. PRD §34 is
        normative and FND-04 acceptance item 3 fails any example with a property ADDED relative to the
        PRD text, so the envelope is not forced onto it (sub-PRD D27).
      properties:
        status: { $ref: '#/components/schemas/AsyncState' }
        clarifications:
          type: array
          items: { $ref: '#/components/schemas/Clarification' }
    SubmitClarificationsRequest:
      description: |
        PRD §34.3: "Clarifications are submitted to `POST /v1/answer-jobs/{job_id}/clarifications`."
        PRD §34.3 also states a stale round returns `409 CLARIFICATION_ROUND_CLOSED`, a code the
        §34.9 catalogue does not list and FND-03's `ERROR_CODE_VALUES` therefore does not contain, so
        this operation declares no stale-round `409` — see sub-PRD **Q-F8** (escalated, not invented).
      type: object
      additionalProperties: false
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [clarification_id, answer]
            properties:
              clarification_id: { $ref: '#/components/schemas/OpaqueId' }
              answer: { type: string }

    # -------------------------------------------------------------------------------------------
    # PRD §34.5 — Answer Snapshot (normative)
    # -------------------------------------------------------------------------------------------
    Claim:
      type: object
      additionalProperties: false
      required: [id, sequence, kind, text, support_status, citation_ids, assumption_ids]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        sequence: { type: integer, minimum: 1 }
        kind:
          description: 'For example `APPLICATION`. Not an `ENUM_REGISTRY` family — sub-PRD Q-F10.'
          type: string
        text: { type: string }
        support_status: { $ref: '#/components/schemas/ClaimSupport' }
        citation_ids:
          type: array
          items: { $ref: '#/components/schemas/OpaqueId' }
        assumption_ids:
          type: array
          items: { $ref: '#/components/schemas/OpaqueId' }
    Citation:
      type: object
      additionalProperties: false
      required: [id, role, document_version_id, node_version_id, pinpoint, quote, start_offset, end_offset, official_url, legal_status, effective_from, effective_to]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        role: { $ref: '#/components/schemas/CitationRole' }
        document_version_id: { $ref: '#/components/schemas/OpaqueId' }
        node_version_id: { $ref: '#/components/schemas/OpaqueId' }
        pinpoint: { type: string }
        quote: { type: string }
        start_offset: { type: integer, minimum: 0 }
        end_offset: { type: integer, minimum: 0 }
        official_url: { type: string, format: uri }
        legal_status: { $ref: '#/components/schemas/LegalStatus' }
        effective_from: { $ref: '#/components/schemas/LegalDate' }
        effective_to: { type: [string, 'null'], format: date }
    Assumption:
      type: object
      additionalProperties: false
      required: [id, text, source, impact_if_false]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        text: { type: string }
        source:
          description: 'For example `USER_NOT_CONFIRMED`. Not an `ENUM_REGISTRY` family — sub-PRD Q-F10.'
          type: string
        impact_if_false: { type: string }
    AnswerSnapshot:
      description: |
        PRD §34.5. "Provider prompts, hidden reasoning and raw provider responses are never part of
        this customer contract."
      type: object
      additionalProperties: false
      required: [schema_version, id, record_id, answer_version, status, short_answer, legal_as_at, knowledge_cutoff_at, jurisdictions, corpus_release_id, claims, citations, assumptions, next_checks, limitations, correction_state, created_at]
      x-envelope-exempt: true
      x-envelope-exempt-reason: |
        PRD §34.5's normative block carries `schema_version` but NO `request_id`. PRD §34 forbids
        property drift and FND-04 acceptance item 3 fails any example with an added property, so the
        envelope is not forced onto it (sub-PRD D27; escalated to the founder as a possible PRD §34.5
        omission, non-blocking).
      properties:
        schema_version: { type: string, const: '1.0' }
        id: { $ref: '#/components/schemas/OpaqueId' }
        record_id: { $ref: '#/components/schemas/OpaqueId' }
        answer_version: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/AnswerStatus' }
        short_answer: { type: string }
        legal_as_at: { $ref: '#/components/schemas/LegalDate' }
        knowledge_cutoff_at: { $ref: '#/components/schemas/Timestamp' }
        jurisdictions:
          type: array
          items: { $ref: '#/components/schemas/JurisdictionCode' }
        corpus_release_id: { $ref: '#/components/schemas/OpaqueId' }
        claims:
          type: array
          items: { $ref: '#/components/schemas/Claim' }
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }
        assumptions:
          type: array
          items: { $ref: '#/components/schemas/Assumption' }
        next_checks:
          type: array
          items: { type: string }
        limitations:
          type: array
          items: { type: string }
        correction_state:
          description: 'For example `NONE`. Not an `ENUM_REGISTRY` family — sub-PRD Q-F10.'
          type: string
        created_at: { $ref: '#/components/schemas/Timestamp' }

    # -------------------------------------------------------------------------------------------
    # PRD §34.6 — Coverage and Compare requests (normative)
    # -------------------------------------------------------------------------------------------
    CoverageAssessmentRequest:
      description: 'PRD §34.6: "Coverage uses the same fact object as Answer plus:" the properties below.'
      type: object
      additionalProperties: false
      required: [legal_as_at]
      properties:
        legal_as_at: { $ref: '#/components/schemas/LegalDate' }
        employer:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: { type: string }
            abn: { type: string, pattern: '^\d{11}$' }
        work_locations:
          type: array
          items: { $ref: '#/components/schemas/JurisdictionCode' }
        principal_duties:
          type: array
          items: { type: string }
        known_agreement_ids:
          type: array
          items: { $ref: '#/components/schemas/OpaqueId' }
        known_award_codes:
          type: array
          items: { type: string }
        retention_mode: { type: string }
        research_record_id: { type: [string, 'null'], pattern: '^[a-z][a-z0-9]*_[A-Za-z0-9._-]+$' }
    ComparisonDimension:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label: { type: string }
        legal_as_at: { $ref: '#/components/schemas/LegalDate' }
        jurisdictions:
          type: array
          items: { $ref: '#/components/schemas/JurisdictionCode' }
    ComparisonRequest:
      description: 'PRD §34.6 comparison request. "Coverage/Compare jobs use the same job, SSE, idempotency, cancellation, retention and budget semantics as answers."'
      type: object
      additionalProperties: false
      required: [comparison_type, dimensions]
      properties:
        comparison_type:
          description: 'For example `TIME`. Not an `ENUM_REGISTRY` family — sub-PRD Q-F10.'
          type: string
        question: { type: string }
        dimensions:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/ComparisonDimension' }
        document_ids:
          type: array
          items: { $ref: '#/components/schemas/OpaqueId' }
        retention_mode: { type: string }
        research_record_id: { type: [string, 'null'], pattern: '^[a-z][a-z0-9]*_[A-Za-z0-9._-]+$' }
    CoverageCandidateSummary:
      description: 'The PRD minimum for a coverage candidate (PRD §8.5). Payload gap — sub-PRD Q-F9, owner `15-answer-product`.'
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        status: { $ref: '#/components/schemas/CoverageCandidateStatus' }
        label: { type: string }

    # -------------------------------------------------------------------------------------------
    # PRD §34.7 — Research Record write contract (normative)
    # -------------------------------------------------------------------------------------------
    ResearchRecordCreateRequest:
      description: 'PRD §34.7 create. Carries NO organisation field (PRD §34.1 Tenant row).'
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        legal_context:
          type: object
          additionalProperties: false
          properties:
            legal_as_at: { $ref: '#/components/schemas/LegalDate' }
            jurisdictions:
              type: array
              items: { $ref: '#/components/schemas/JurisdictionCode' }
        owner_user_id: { $ref: '#/components/schemas/OpaqueId' }
        reviewer_user_id: { type: [string, 'null'], pattern: '^[a-z][a-z0-9]*_[A-Za-z0-9._-]+$' }
        tags:
          type: array
          items: { type: string }
    ResearchRecordTurnCreateRequest:
      description: |
        PRD §34.7: "Formal facts/questions are added as immutable turns … A mistake is corrected by
        adding a new turn with `supersedes_turn_id`, never by editing the original turn." That is why
        `/turns` has no PATCH and no DELETE.
      type: object
      additionalProperties: false
      required: [turn_type, content]
      properties:
        turn_type:
          description: 'For example `FACT_CLARIFICATION`. Not an `ENUM_REGISTRY` family — sub-PRD Q-F10.'
          type: string
        content:
          type: object
          additionalProperties: true
        supersedes_turn_id: { type: [string, 'null'], pattern: '^[a-z][a-z0-9]*_[A-Za-z0-9._-]+$' }
    ResearchRecordUpdateRequest:
      description: 'PRD §34.7: "Mutable metadata updates require `If-Match: \"7\"`." Metadata only — turns are immutable.'
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1 }
        reviewer_user_id: { type: [string, 'null'], pattern: '^[a-z][a-z0-9]*_[A-Za-z0-9._-]+$' }
        workflow_state: { $ref: '#/components/schemas/RecordWorkflowState' }
        tags:
          type: array
          items: { type: string }
    ResearchRecordSummary:
      description: 'The PRD minimum for a Research Record read (PRD §8.7, §34.7). Payload gap — sub-PRD Q-F9, owner `13-research-records`.'
      type: object
      additionalProperties: false
      required: [id, title, workflow_state, created_at]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        title: { type: string }
        workflow_state: { $ref: '#/components/schemas/RecordWorkflowState' }
        created_at: { $ref: '#/components/schemas/Timestamp' }

    # -------------------------------------------------------------------------------------------
    # PRD minimum shapes for §16.2/§16.3 operations §34 gives no payload for (sub-PRD Q-F9).
    # Each response carries the envelope and, where it is a collection, the pagination contract.
    # The owning product module extends them through a NEW 00-foundation ticket — no other module may
    # write this file (PRD §44.3; FND-04 Feedback obligation 3).
    # -------------------------------------------------------------------------------------------
    ResourceResponse:
      description: 'A single resource whose payload PRD §34 does not specify. Marked `x-prd-payload-gap` at the operation.'
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          required: [resource]
          properties:
            resource:
              type: object
              additionalProperties: true
      unevaluatedProperties: false
    CollectionResponse:
      description: 'PRD §34.1 cursor pagination: an items page plus the opaque `next_cursor`.'
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          required: [items, next_cursor]
          properties:
            items:
              type: array
              items:
                type: object
                additionalProperties: true
            next_cursor: { $ref: '#/components/schemas/Cursor' }
      unevaluatedProperties: false
    AcknowledgementResponse:
      description: 'A state-changing action whose only contract is that it succeeded, plus the envelope.'
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
      unevaluatedProperties: false
    AlertSummary:
      description: 'The PRD minimum for an alert (PRD §8.8, §34.8 `data`). Payload gap — sub-PRD Q-F9, owner `16-monitor-alerts`.'
      type: object
      additionalProperties: false
      required: [id, change_type, effective_date]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        watchlist_id: { $ref: '#/components/schemas/OpaqueId' }
        change_type: { $ref: '#/components/schemas/ChangeType' }
        effective_date: { $ref: '#/components/schemas/LegalDate' }
        affected_research_record_ids:
          type: array
          items: { $ref: '#/components/schemas/OpaqueId' }
    AlertResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          required: [alert]
          properties:
            alert: { $ref: '#/components/schemas/AlertSummary' }
      unevaluatedProperties: false
    MembershipSummary:
      description: 'The PRD minimum for a membership (PRD §8.1, §16.3). Payload gap — sub-PRD Q-F9, owner `02-identity-access`. Carries no organisation identifier: PRD §34.1 derives the tenant from the credential.'
      type: object
      additionalProperties: false
      required: [id, role]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        user_id: { $ref: '#/components/schemas/OpaqueId' }
        role: { $ref: '#/components/schemas/Role' }
    MembershipUpdateRequest:
      description: 'PRD §16.3 membership lifecycle; PRD §38.1 `MEMBERSHIP_ROLE_CHANGE`.'
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/Role' }
    InvitationCreateRequest:
      description: 'PRD §16.3 "Invitation and membership lifecycle endpoints". No organisation field — the tenant comes from the credential (PRD §34.1).'
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
    SsoConnectionCreateRequest:
      description: 'PRD §16.3 "SAML/OIDC SSO connection create/test/activate/disable". PRD §16.4 bans arbitrary base URLs, so the metadata URL is constrained to https.'
      type: object
      additionalProperties: false
      required: [protocol, metadata_url]
      properties:
        protocol:
          description: '`SAML` or `OIDC`. Not an `ENUM_REGISTRY` family — sub-PRD Q-F10.'
          type: string
        metadata_url: { type: string, format: uri, pattern: '^https://' }
    SsoConnectionSummary:
      description: 'PRD §16.3: "SSO cannot be enforced before a successful test." The state machine is `SsoConnectionState`. No secret material is ever returned (PRD §16.4).'
      type: object
      additionalProperties: false
      required: [id, state]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        state: { $ref: '#/components/schemas/SsoConnectionState' }
        protocol: { type: string }
    SsoConnectionResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          required: [sso_connection]
          properties:
            sso_connection: { $ref: '#/components/schemas/SsoConnectionSummary' }
      unevaluatedProperties: false
    ServiceAccountCreateRequest:
      description: 'PRD §16.3 "Service-account and credential create/rotate/revoke".'
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
    ServiceAccountCredentialCreateRequest:
      description: 'PRD §16.3: the credential''s scopes are `ApiScope` members.'
      type: object
      additionalProperties: false
      required: [scopes]
      properties:
        label: { type: string }
        scopes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ApiScope' }
    ServiceAccountCredentialResponse:
      description: |
        PRD §16.4: "Keys are displayed only on entry, decrypted only inside the Model Gateway and
        excluded from logs/exports/support." This response therefore returns the credential's
        IDENTIFIER, its scopes and its lifecycle timestamps — never the credential material itself.
        test/openapi/conventions.test.ts asserts that no response schema in this document declares a
        secret-shaped property.
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          required: [credential]
          properties:
            credential:
              type: object
              additionalProperties: false
              required: [id, scopes, created_at]
              properties:
                id: { $ref: '#/components/schemas/OpaqueId' }
                label: { type: string }
                scopes:
                  type: array
                  items: { $ref: '#/components/schemas/ApiScope' }
                created_at: { $ref: '#/components/schemas/Timestamp' }
                last_rotated_at: { $ref: '#/components/schemas/Timestamp' }
      unevaluatedProperties: false
    ExportCreateRequest:
      description: 'PRD §16.2 "`POST /v1/exports`". Payload gap — sub-PRD Q-F9, owner `17-export-delivery`.'
      type: object
      additionalProperties: false
      required: [research_record_id]
      properties:
        research_record_id: { $ref: '#/components/schemas/OpaqueId' }
        format:
          description: 'The export format. Not an `ENUM_REGISTRY` family — sub-PRD Q-F10.'
          type: string
    JobAcceptedResponse:
      description: 'A generic accepted-job response, the same shape PRD §34.3 fixes for answers.'
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          required: [job]
          properties:
            job: { $ref: '#/components/schemas/JobDescriptor' }
      unevaluatedProperties: false
    CoverageAssessmentJobResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          required: [job]
          properties:
            job: { $ref: '#/components/schemas/JobDescriptor' }
            candidates:
              type: array
              items: { $ref: '#/components/schemas/CoverageCandidateSummary' }
      unevaluatedProperties: false
    ResearchRecordResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          required: [research_record]
          properties:
            research_record: { $ref: '#/components/schemas/ResearchRecordSummary' }
      unevaluatedProperties: false
    MembershipResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          required: [membership]
          properties:
            membership: { $ref: '#/components/schemas/MembershipSummary' }
      unevaluatedProperties: false
    SystemStatusResponse:
      description: 'PRD §16.2 "`GET /v1/system-status`". PRD §34.9 `GENERATION_UNAVAILABLE`: "Search remains available; retry when status recovers." Payload gap — sub-PRD Q-F9, owner `18-ops-release`.'
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          required: [search_available, generation_available]
          properties:
            search_available: { type: boolean }
            generation_available: { type: boolean }
            corpus_release_id: { $ref: '#/components/schemas/OpaqueId' }
      unevaluatedProperties: false

# =================================================================================================
# PATHS. Keys are relative to servers[0] (`/v1`) — see the header note. Every operation carries
# `x-prd-basis`; every write carries `x-retryable-write`; every PATCH/DELETE carries
# `x-mutable-resource`.
# =================================================================================================
paths:

  # -----------------------------------------------------------------------------------------------
  # PRD §16.2 — Search and authorities
  # -----------------------------------------------------------------------------------------------
  /search:
    post:
      operationId: search
      tags: [Search and authorities]
      summary: Search official sources.
      description: |
        PRD §16.2: "Search is read-only despite POST and MUST not consume generation credits."

        It is a `POST` because the filter object does not fit a query string, not because it mutates
        anything: `x-read-only` is true, `x-charges-credits` is false, `x-retryable-write` is false,
        and `429 CREDIT_LIMIT_REACHED` is deliberately not declared. PRD §34.2: "Search does not
        return generated summaries."
      x-prd-basis: '§16.2'
      x-read-only: true
      x-charges-credits: false
      x-retryable-write: false
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
            examples:
              prd-34-2:
                summary: PRD §34.2 normative request.
                externalValue: examples/prd-34-2-search-request.json
      responses:
        '200':
          description: Ranked official source excerpts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
              examples:
                prd-34-2:
                  summary: PRD §34.2 normative response.
                  externalValue: examples/prd-34-2-search-response.json
        '400': { $ref: '#/components/responses/InvalidRequestOrLegalDate' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/SearchServiceUnavailable' }

  /documents/{document_id}:
    parameters:
      - name: document_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/OpaqueId' }
    get:
      operationId: getDocument
      tags: [Search and authorities]
      summary: Retrieve an official document.
      x-prd-basis: '§16.2'
      x-prd-payload-gap: 04-corpus-contract
      responses:
        '200':
          description: The document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/SearchServiceUnavailable' }

  /documents/{document_id}/versions:
    parameters:
      - name: document_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/OpaqueId' }
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Cursor'
    get:
      operationId: listDocumentVersions
      tags: [Search and authorities]
      summary: List a document's versions.
      x-prd-basis: '§16.2'
      x-prd-payload-gap: 04-corpus-contract
      responses:
        '200':
          description: A page of document versions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /document-versions/{version_id}/nodes:
    parameters:
      - name: version_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/OpaqueId' }
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Cursor'
    get:
      operationId: listDocumentVersionNodes
      tags: [Search and authorities]
      summary: List the nodes of a document version.
      x-prd-basis: '§16.2'
      x-prd-payload-gap: 04-corpus-contract
      responses:
        '200':
          description: A page of nodes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /node-versions/{node_version_id}:
    parameters:
      - name: node_version_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/OpaqueId' }
    get:
      operationId: getNodeVersion
      tags: [Search and authorities]
      summary: Retrieve one node version — the citable unit.
      x-prd-basis: '§16.2'
      x-prd-payload-gap: 04-corpus-contract
      responses:
        '200':
          description: The node version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /documents/{document_id}/timeline:
    parameters:
      - name: document_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/OpaqueId' }
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Cursor'
    get:
      operationId: getDocumentTimeline
      tags: [Search and authorities]
      summary: The version timeline of a document.
      x-prd-basis: '§16.2'
      x-prd-payload-gap: 04-corpus-contract
      responses:
        '200':
          description: A page of timeline entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /nodes/{node_id}/timeline:
    parameters:
      - name: node_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/OpaqueId' }
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Cursor'
    get:
      operationId: getNodeTimeline
      tags: [Search and authorities]
      summary: The version timeline of a node.
      x-prd-basis: '§16.2'
      x-prd-payload-gap: 04-corpus-contract
      responses:
        '200':
          description: A page of timeline entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /documents/{document_id}/relations:
    parameters:
      - name: document_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/OpaqueId' }
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Cursor'
    get:
      operationId: getDocumentRelations
      tags: [Search and authorities]
      summary: Relations declared on a document.
      x-prd-basis: '§16.2'
      x-prd-payload-gap: 04-corpus-contract
      responses:
        '200':
          description: A page of relations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /nodes/{node_id}/relations:
    parameters:
      - name: node_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/OpaqueId' }
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Cursor'
    get:
      operationId: getNodeRelations
      tags: [Search and authorities]
      summary: Relations declared on a node.
      x-prd-basis: '§16.2'
      x-prd-payload-gap: 04-corpus-contract
      responses:
        '200':
          description: A page of relations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  # -----------------------------------------------------------------------------------------------
  # PRD §16.2 — Answers (plus the §34.3 clarifications submission, sub-PRD D24)
  # -----------------------------------------------------------------------------------------------
  /answers:
    post:
      operationId: createAnswerJob
      tags: [Answers]
      summary: Admit an Answer job.
      description: |
        PRD §34.3. The `202` body is either the accepted job or the clarification-required variant —
        "Clarification response still uses `202`; the job status becomes `WAITING_FOR_CLARIFICATION`
        and supplies questions." Both normative blocks are wired in as examples below.
      x-prd-basis: '§16.2, §34.3'
      x-retryable-write: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAnswerJobRequest' }
            examples:
              prd-34-3:
                summary: PRD §34.3 normative request.
                externalValue: examples/prd-34-3-create-answer-job.json
      responses:
        '202':
          description: The job was admitted, or clarification is required.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AnswerJobAccepted'
                  - $ref: '#/components/schemas/AnswerJobClarificationRequired'
              examples:
                prd-34-3-accepted:
                  summary: PRD §34.3 normative accepted response.
                  externalValue: examples/prd-34-3-answer-job-accepted.json
                prd-34-3-clarification:
                  summary: PRD §34.3 normative clarification response.
                  externalValue: examples/prd-34-3-clarification-response.json
        '400': { $ref: '#/components/responses/InvalidRequestOrLegalDateOrAbn' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/EmployeePiiDetected' }
        '429': { $ref: '#/components/responses/RateLimitedOrCreditLimitReached' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/GenerationServiceUnavailable' }

  /answer-jobs/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/OpaqueId' }
    get:
      operationId: getAnswerJob
      tags: [Answers]
      summary: Poll an Answer job.
      description: 'PRD §16.1 keeps the HTTP status and the domain job status separate; the job status is `AsyncState`.'
      x-prd-basis: '§16.2'
      responses:
        '200':
          description: The current job state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAcceptedResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '410': { $ref: '#/components/responses/EphemeralContentExpired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /answer-jobs/{job_id}/events:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/OpaqueId' }
      - name: Last-Event-ID
        in: header
        required: false
        description: 'PRD §34.4: "Clients connect with `Accept: text/event-stream` and may reconnect using `Last-Event-ID`."'
        schema: { type: string }
    get:
      operationId: streamAnswerJobEvents
      tags: [Answers]
      summary: Subscribe to an Answer job's event stream.
      description: |
        PRD §34.4. Declared here as an endpoint with a `text/event-stream` response and **no event
        payload schema**: the SSE *event schemas* are `FND-05` (`schemas/events/**`) and the SSE
        *transport* is `RUNT-03` — both are FND-04 Non-goals 2 and 3. PRD §16.2: SSE events "MUST NOT
        contain hidden reasoning or raw provider payloads."
      x-prd-basis: '§16.2, §34.4'
      responses:
        '200':
          description: An SSE stream of job events.
          content:
            text/event-stream:
              schema:
                type: string
                description: 'The raw SSE byte stream. Its event payloads are defined by `schemas/events/**` (FND-05), not by this document.'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '410': { $ref: '#/components/responses/EphemeralContentExpired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /answer-jobs/{job_id}/cancel:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/OpaqueId' }
    post:
      operationId: cancelAnswerJob
      tags: [Answers]
      summary: Cancel an Answer job.
      description: 'State-idempotent: cancelling an already-cancelling job is not a new effect, so no `Idempotency-Key` is required.'
      x-prd-basis: '§16.2'
      x-retryable-write: false
      responses:
        '202':
          description: Cancellation was accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAcceptedResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '410': { $ref: '#/components/responses/EphemeralContentExpired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /answer-jobs/{job_id}/clarifications:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/OpaqueId' }
    post:
      operationId: submitAnswerJobClarifications
      tags: [Answers]
      summary: Submit answers to a clarification round.
      description: |
        PRD §34.3: "Clarifications are submitted to `POST /v1/answer-jobs/{job_id}/clarifications`."
        Derived from §34.3 rather than §16.2, which does not list it (sub-PRD D24).

        §34.3 also states "Submitting a stale clarification round returns
        `409 CLARIFICATION_ROUND_CLOSED`". That code is absent from the §34.9 catalogue and from
        `FND-03`'s `ENUM_REGISTRY.ErrorCode`, so it CANNOT be declared without inventing an
        eighteenth member, which acceptance items 4 and 5 forbid. The gap is escalated as sub-PRD
        **Q-F8**; this operation declares no stale-round `409`.
      x-prd-basis: '§34.3'
      x-retryable-write: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitClarificationsRequest' }
      responses:
        '202':
          description: The clarification round was accepted and the job resumed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAcceptedResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '410': { $ref: '#/components/responses/EphemeralContentExpired' }
        '422': { $ref: '#/components/responses/EmployeePiiDetected' }
        '429': { $ref: '#/components/responses/RateLimitedOrCreditLimitReached' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/GenerationServiceUnavailable' }

  /answers/{answer_snapshot_id}:
    parameters:
      - name: answer_snapshot_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/OpaqueId' }
    get:
      operationId: getAnswerSnapshot
      tags: [Answers]
      summary: Retrieve an Answer Snapshot.
      description: 'PRD §34.5. `410 EPHEMERAL_CONTENT_EXPIRED` covers an `EPHEMERAL` retention snapshot that has passed its window (PRD §10.4).'
      x-prd-basis: '§16.2, §34.5'
      responses:
        '200':
          description: The Answer Snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnswerSnapshot' }
              examples:
                prd-34-5:
                  summary: PRD §34.5 normative Answer Snapshot.
                  externalValue: examples/prd-34-5-answer-snapshot.json
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '410': { $ref: '#/components/responses/EphemeralContentExpired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /answers/{answer_snapshot_id}/rerun:
    parameters:
      - name: answer_snapshot_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/OpaqueId' }
    post:
      operationId: rerunAnswer
      tags: [Answers]
      summary: Re-run an answer against the current corpus release.
      x-prd-basis: '§16.2'
      x-retryable-write: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '202':
          description: A new Answer job was admitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAcceptedResponse' }
        '400': { $ref: '#/components/responses/InvalidRequestOrLegalDate' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '410': { $ref: '#/components/responses/EphemeralContentExpired' }
        '429': { $ref: '#/components/responses/RateLimitedOrCreditLimitReached' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/GenerationServiceUnavailable' }

  # -----------------------------------------------------------------------------------------------
  # PRD §16.2 — Compare and coverage
  # -----------------------------------------------------------------------------------------------
  /comparisons:
    post:
      operationId: createComparisonJob
      tags: [Compare and coverage]
      summary: Admit a Comparison job.
      description: 'PRD §34.6: "Coverage/Compare jobs use the same job, SSE, idempotency, cancellation, retention and budget semantics as answers."'
      x-prd-basis: '§16.2, §34.6'
      x-retryable-write: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComparisonRequest' }
            examples:
              prd-34-6:
                summary: PRD §34.6 normative comparison request.
                externalValue: examples/prd-34-6-comparison-request.json
      responses:
        '202':
          description: The comparison job was admitted.
          content:
            application/json:
