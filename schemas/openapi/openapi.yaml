        in: path
        required: true
        schema: { $ref: '#/components/schemas/OpaqueId' }
    post:
      operationId: rotateWebhookSubscriptionSigningMaterial
      tags: [Monitor and delivery]
      summary: Rotate the subscription's HMAC signing material.
      description: |
        PRD §34.8 signs deliveries with `v1=<lowercase hex HMAC-SHA256>` over
        `<timestamp>.<raw_request_body>`. Rotation replaces the signing material; PRD §16.4's rule
