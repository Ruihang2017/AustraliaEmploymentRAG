        timestamp and never the material itself.
      x-prd-basis: '§16.2, §34.8'
      x-prd-payload-gap: 16-monitor-alerts
      x-retryable-write: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Rotation completed. No signing material is returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcknowledgementResponse' }
