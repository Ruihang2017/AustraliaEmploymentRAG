  # -----------------------------------------------------------------------------------------------
  # PRD §16.3 — Authentication and machine access
  #
  # EVERY operation below is DERIVED. §16.3 states five capability sentences and no path at all, so
  # the paths are produced by sub-PRD D23(e)'s rule — one collection per noun, lifecycle transitions
  # as `POST /{id}/<verb>` — and every one is marked `derived: true` in
  # packages/contracts/test/openapi/prd-16-2-endpoints.json with the verbatim §16.3 sentence it comes
  # from, so the Reviewer reads the derivation instead of trusting it. Customer-visible path names
  # remain the founder's to overrule (PRD §45.5).
  #
  # None of these operations accepts an organisation identifier: PRD §16.5's flow is
  # "authenticate → resolve organisation → verify membership/service account → …", and the
  # organisation comes from the credential, never from the request (PRD §34.1 Tenant row).
  # -----------------------------------------------------------------------------------------------
  /invitations:
    get:
      operationId: listInvitations
      tags: [Authentication and machine access]
      summary: List membership invitations.
      x-prd-basis: '§16.3'
      x-prd-payload-gap: 02-identity-access
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of invitations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/MfaOrRecentAuthRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createInvitation
      tags: [Authentication and machine access]
      summary: Invite a user to the organisation.
      x-prd-basis: '§16.3'
      x-prd-payload-gap: 02-identity-access
      x-retryable-write: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationCreateRequest' }
      responses:
        '201':
          description: The invitation was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/MfaOrRecentAuthRequired' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /invitations/{invitation_id}/accept:
    parameters:
      - name: invitation_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/OpaqueId' }
    post:
      operationId: acceptInvitation
      tags: [Authentication and machine access]
      summary: Accept an invitation.
      description: 'State-idempotent, so no `Idempotency-Key` is required.'
      x-prd-basis: '§16.3'
      x-prd-payload-gap: 02-identity-access
      x-retryable-write: false
      responses:
        '200':
          description: The invitation was accepted and a membership created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /invitations/{invitation_id}/revoke:
    parameters:
      - name: invitation_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/OpaqueId' }
    post:
      operationId: revokeInvitation
      tags: [Authentication and machine access]
      summary: Revoke an invitation.
      description: 'State-idempotent, so no `Idempotency-Key` is required.'
      x-prd-basis: '§16.3'
      x-prd-payload-gap: 02-identity-access
      x-retryable-write: false
      responses:
        '200':
          description: The invitation was revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcknowledgementResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/MfaOrRecentAuthRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /memberships:
    get:
      operationId: listMemberships
      tags: [Authentication and machine access]
      summary: List organisation memberships.
      x-prd-basis: '§16.3'
      x-prd-payload-gap: 02-identity-access
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of memberships.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /memberships/{membership_id}:
    parameters:
      - name: membership_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/OpaqueId' }
    get:
      operationId: getMembership
      tags: [Authentication and machine access]
      summary: Retrieve a membership.
      x-prd-basis: '§16.3'
      responses:
        '200':
          description: The membership. The `ETag` is the value to echo in `If-Match`.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: updateMembership
      tags: [Authentication and machine access]
      summary: Change a membership role.
      description: 'PRD §38.1 `MEMBERSHIP_ROLE_CHANGE`; PRD §16.3 makes it a security-sensitive change, hence the `403`.'
      x-prd-basis: '§16.3'
      x-mutable-resource: true
      x-retryable-write: false
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MembershipUpdateRequest' }
      responses:
        '200':
          description: The updated membership.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/MfaOrRecentAuthRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/ConcurrentModification' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteMembership
      tags: [Authentication and machine access]
      summary: Remove a membership.
      x-prd-basis: '§16.3'
      x-mutable-resource: true
      x-retryable-write: false
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: The membership was removed.
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/MfaOrRecentAuthRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/ConcurrentModification' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /sessions:
    get:
      operationId: listSessions
      tags: [Authentication and machine access]
      summary: List the authenticated user's active sessions.
      x-prd-basis: '§16.3'
      x-prd-payload-gap: 02-identity-access
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of sessions. No session material is returned, only metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /sessions/{session_id}:
    parameters:
      - name: session_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/OpaqueId' }
    delete:
      operationId: revokeSession
      tags: [Authentication and machine access]
      summary: Revoke a session.
      description: |
        A revocation, not an edit of a mutable resource: `x-mutable-resource` is false, so no
        `If-Match` and no `409 CONCURRENT_MODIFICATION`. Revoking an already-revoked session is not a
        conflict.
      x-prd-basis: '§16.3'
      x-mutable-resource: false
      x-retryable-write: false
      responses:
        '204':
          description: The session was revoked.
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/MfaOrRecentAuthRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /recent-authentication-checks:
    post:
      operationId: createRecentAuthenticationCheck
      tags: [Authentication and machine access]
      summary: Assert a recent authentication before a sensitive change.
      description: 'PRD §16.3 "recent-authentication checks"; PRD §34.9 `RECENT_AUTH_REQUIRED` is the error this clears.'
      x-prd-basis: '§16.3'
      x-prd-payload-gap: 02-identity-access
      x-retryable-write: false
      responses:
        '200':
          description: Recent authentication was confirmed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcknowledgementResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/MfaOrRecentAuthRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /mfa/totp:
    post:
      operationId: enrolTotp
      tags: [Authentication and machine access]
      summary: Begin TOTP enrolment.
      description: 'PRD §16.3 "TOTP, passkey and recovery-code lifecycle". The enrolment material is shown once at enrolment, mirroring PRD §16.4''s display-on-entry rule.'
      x-prd-basis: '§16.3'
      x-prd-payload-gap: 02-identity-access
      x-retryable-write: false
      responses:
        '201':
          description: Enrolment started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/MfaOrRecentAuthRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: removeTotp
      tags: [Authentication and machine access]
      summary: Remove TOTP enrolment.
      x-prd-basis: '§16.3'
      x-mutable-resource: false
      x-retryable-write: false
      responses:
        '204':
          description: TOTP enrolment was removed.
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/MfaOrRecentAuthRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /mfa/totp/activate:
    post:
      operationId: activateTotp
      tags: [Authentication and machine access]
      summary: Activate TOTP by proving a code.
      x-prd-basis: '§16.3'
      x-prd-payload-gap: 02-identity-access
      x-retryable-write: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [otp]
              properties:
                otp: { type: string, minLength: 6, maxLength: 10 }
      responses:
        '200':
          description: TOTP was activated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcknowledgementResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/MfaOrRecentAuthRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /mfa/passkeys:
    get:
      operationId: listPasskeys
      tags: [Authentication and machine access]
      summary: List registered passkeys.
      x-prd-basis: '§16.3'
      x-prd-payload-gap: 02-identity-access
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of passkey registrations, metadata only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: beginPasskeyRegistration
      tags: [Authentication and machine access]
      summary: Begin a passkey registration.
      x-prd-basis: '§16.3'
      x-prd-payload-gap: 02-identity-access
      x-retryable-write: false
      responses:
        '201':
          description: A registration challenge was issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/MfaOrRecentAuthRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /mfa/passkeys/activate:
    post:
      operationId: activatePasskey
      tags: [Authentication and machine access]
      summary: Complete a passkey registration.
      x-prd-basis: '§16.3'
      x-prd-payload-gap: 02-identity-access
      x-retryable-write: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: 'The WebAuthn attestation response. Its exact shape is `02-identity-access` (sub-PRD Q-F9).'
      responses:
        '200':
          description: The passkey was registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcknowledgementResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/MfaOrRecentAuthRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /mfa/passkeys/{passkey_id}:
    parameters:
      - name: passkey_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/OpaqueId' }
    delete:
      operationId: removePasskey
      tags: [Authentication and machine access]
      summary: Remove a passkey.
      x-prd-basis: '§16.3'
      x-mutable-resource: false
      x-retryable-write: false
      responses:
        '204':
          description: The passkey was removed.
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/MfaOrRecentAuthRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags: [Authentication and machine access]
      summary: Regenerate recovery codes.
      description: |
        PRD §16.3 "recovery-code lifecycle". The codes are returned exactly once, at generation —
        the same display-on-entry discipline PRD §16.4 imposes on BYOK material — and no later read
        in this document returns them. Each call invalidates the previous set, so it is a retryable
        write and carries an `Idempotency-Key`.
      x-prd-basis: '§16.3'
      x-prd-payload-gap: 02-identity-access
      x-retryable-write: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '201':
          description: A fresh set of recovery codes, shown once.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required: [codes]
                    properties:
                      codes:
                        type: array
                        minItems: 1
                        items: { type: string }
                unevaluatedProperties: false
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/MfaOrRecentAuthRequired' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /sso-connections:
    get:
      operationId: listSsoConnections
      tags: [Authentication and machine access]
      summary: List SSO connections.
      x-prd-basis: '§16.3'
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of SSO connections, each in an `SsoConnectionState`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/MfaOrRecentAuthRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createSsoConnection
      tags: [Authentication and machine access]
      summary: Create a SAML/OIDC SSO connection.
      description: 'PRD §16.3: a new connection starts in `DRAFT`. "SSO cannot be enforced before a successful test."'
      x-prd-basis: '§16.3'
      x-retryable-write: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SsoConnectionCreateRequest' }
      responses:
        '201':
          description: The connection was created in `DRAFT`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SsoConnectionResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/MfaOrRecentAuthRequired' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /sso-connections/{sso_connection_id}/test:
    parameters:
      - name: sso_connection_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/OpaqueId' }
    post:
      operationId: testSsoConnection
      tags: [Authentication and machine access]
      summary: Run a connection test, moving the connection to `TESTING`.
      x-prd-basis: '§16.3'
      x-retryable-write: false
      responses:
        '200':
          description: The test was started or completed; the state reflects the outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SsoConnectionResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/MfaOrRecentAuthRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /sso-connections/{sso_connection_id}/activate:
    parameters:
      - name: sso_connection_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/OpaqueId' }
    post:
      operationId: activateSsoConnection
      tags: [Authentication and machine access]
      summary: Activate an SSO connection.
      description: 'PRD §16.3: "SSO cannot be enforced before a successful test", so this fails with `400 INVALID_REQUEST` unless the connection has passed a test.'
      x-prd-basis: '§16.3'
      x-retryable-write: false
      responses:
        '200':
          description: The connection is `ACTIVE`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SsoConnectionResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/MfaOrRecentAuthRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /sso-connections/{sso_connection_id}/disable:
    parameters:
      - name: sso_connection_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/OpaqueId' }
    post:
      operationId: disableSsoConnection
      tags: [Authentication and machine access]
      summary: Disable an SSO connection.
      description: 'PRD §16.3 keeps an MFA-protected Owner break-glass account available, so disabling SSO never locks the organisation out.'
      x-prd-basis: '§16.3'
      x-retryable-write: false
      responses:
        '200':
          description: The connection is `DISABLED`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SsoConnectionResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/MfaOrRecentAuthRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /service-accounts:
    get:
      operationId: listServiceAccounts
      tags: [Authentication and machine access]
      summary: List service accounts.
      x-prd-basis: '§16.3'
      x-prd-payload-gap: 02-identity-access
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of service accounts. No credential material is returned (PRD §16.4).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/MfaOrRecentAuthRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createServiceAccount
      tags: [Authentication and machine access]
      summary: Create a service account.
      x-prd-basis: '§16.3'
      x-prd-payload-gap: 02-identity-access
      x-retryable-write: true
