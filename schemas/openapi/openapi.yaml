  # -----------------------------------------------------------------------------------------------
  # PRD §16.2 — Research and collaboration
  #
  # "Editable resources MUST use ETag/version + `If-Match`; conflicts return
  # `409 CONCURRENT_MODIFICATION`" (PRD §16.2). Research records, comments, watchlists, webhook
  # subscriptions and memberships are the editable resources in this document; each one's GET
  # declares the `ETag` response header and each one's PATCH/DELETE requires `If-Match`.
  #
  # `CRUD /v1/research-records` and `CRUD /v1/comments and /resolve` are expanded by sub-PRD D23.
  # -----------------------------------------------------------------------------------------------
  /research-records:
    get:
      operationId: listResearchRecords
      tags: [Research and collaboration]
      summary: List Research Records.
      x-prd-basis: '§16.2'
      x-prd-payload-gap: 13-research-records
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of Research Records.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createResearchRecord
      tags: [Research and collaboration]
      summary: Create a Research Record.
      description: 'PRD §34.7 create contract.'
      x-prd-basis: '§16.2, §34.7'
      x-retryable-write: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResearchRecordCreateRequest' }
            examples:
              prd-34-7:
                summary: PRD §34.7 normative create request.
                externalValue: examples/prd-34-7-research-record-create.json
      responses:
        '201':
          description: The Research Record was created.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResearchRecordResponse' }
        '400': { $ref: '#/components/responses/InvalidRequestOrLegalDate' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/EmployeePiiDetected' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /research-records/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/OpaqueId' }
    get:
      operationId: getResearchRecord
      tags: [Research and collaboration]
      summary: Retrieve a Research Record.
      x-prd-basis: '§16.2'
      responses:
        '200':
          description: The Research Record. The `ETag` is the value to echo in `If-Match`.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResearchRecordResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: updateResearchRecord
      tags: [Research and collaboration]
      summary: Update a Research Record's mutable metadata.
      description: |
        PRD §34.7: "Mutable metadata updates require `If-Match: \"7\"`." Turns are immutable and are
        corrected by superseding, never by editing — see `POST /v1/research-records/{id}/turns`.
        `If-Match` is this operation's concurrency control, so no `Idempotency-Key` is required
        (`x-retryable-write` is false and `409` here is `CONCURRENT_MODIFICATION`, never
        `IDEMPOTENCY_CONFLICT`).
      x-prd-basis: '§16.2, §34.7'
      x-mutable-resource: true
      x-retryable-write: false
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResearchRecordUpdateRequest' }
      responses:
        '200':
          description: The updated Research Record.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResearchRecordResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/ConcurrentModification' }
        '422': { $ref: '#/components/responses/EmployeePiiDetected' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteResearchRecord
      tags: [Research and collaboration]
      summary: Delete a Research Record.
      x-prd-basis: '§16.2'
      x-mutable-resource: true
      x-retryable-write: false
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: The Research Record was deleted.
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/ConcurrentModification' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

