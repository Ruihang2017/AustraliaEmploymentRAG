group_id: DEMO-APPROVED-NO-REASON
schemes: [https]
hosts:
  - host: bulk.example.test
    include_subdomains: false
    path_prefixes: ["/"]
    approved_max_bytes: 104857600
    approved_max_bytes_reason: null
